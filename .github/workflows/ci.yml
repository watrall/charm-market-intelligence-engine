name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for thorough scanning

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck-test:
    runs-on: ubuntu-latest
    needs: secrets-scan  # Don't run tests if secrets are found
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download NLP models
        run: |
          python -c "import spacy.cli; spacy.cli.download('en_core_web_sm')"
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Lint with Ruff
        run: |
          ruff check scripts/ dashboard/ tests/ --output-format=github

      - name: Type check with mypy
        run: |
          mypy --explicit-package-bases scripts/ --ignore-missing-imports

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          # Disable external services during CI
          USE_SQLITE: "false"
          USE_SHEETS: "false"
          USE_LLM: "false"
          CHARM_SEED: "42"
