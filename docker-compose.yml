services:
  dashboard:
    build: .
    command: ["dashboard"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./secrets:/app/secrets

  pipeline:
    build: .
    command: ["pipeline"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./secrets:/app/secrets

